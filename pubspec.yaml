name: cs2_tracker
description: "CS2 Account & Drop Manager — multi-account tracking, weekly drop timer, general inventory and CS2 ranks."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.4.3+1

  # Notifications & timezone
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  path_provider: ^2.1.3
  share_plus: ^13.3.0
  file_picker: ^12.3.0
  package_info_plus: ^10.2.1
  open_file: ^4.0.0

  # Gráficas del dashboard de estadísticas
  fl_chart: ^1.2.0

  # Bloqueo de la app con PIN/huella
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Widget de pantalla de inicio (Android)
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/cs2_logo.jpg
